plugins {
    id "com.android.application"
}

// Release signing: the key and its passwords stay outside the repository, in a properties file
// (storeFile, storePassword, keyAlias, keyPassword) at ~/faunalapse-signing/signing.properties or
// where FAUNALAPSE_SIGNING names it. Debug builds and tests need no key; release builds stop without
// it ("missing required property storeFile"), so no release APK goes out with another key.
def signingFile = file(System.getenv("FAUNALAPSE_SIGNING")
        ?: "${System.getProperty("user.home")}/faunalapse-signing/signing.properties")
def signing = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signing.load(it) }
}

android {
    namespace = "com.faunalapse.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.faunalapse.app"
        minSdk = 24       // Android 7.0, the oldest phone we can test
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0-beta.1"
    }

    signingConfigs {
        release {
            if (signing["storeFile"]) {
                storeFile = file(signing["storeFile"])
                storePassword = signing["storePassword"]
                keyAlias = signing["keyAlias"]
                keyPassword = signing["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        // Java 8 language level (lambdas). D8 turns lambdas into plain classes.
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

// No dependencies inside the app: only Android's own classes (see AGENTS.md).
// JUnit is used only for the tests that run on the PC; it never goes into the APK.
dependencies {
    testImplementation "junit:junit:4.13.2"
}

// The Android build plugin 9 adds the Kotlin standard library (about 2.4 MB) on its own; this app
// has no Kotlin code, so leave it out.
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib"
}

tasks.withType(JavaCompile).configureEach {
    // Hide the "source value 8 is obsolete" note from new JDKs; Java 8 is a deliberate choice.
    options.compilerArgs += ["-Xlint:-options"]
}
